# Example game manifest. The example has no registry dependencies.
#
# The in-repo hooks package is NOT a Wally dependency (Wally has no path dependencies). Rojo maps
# ../../hooks/src straight to ReplicatedStorage.Packages.StagehandHooks (see default.project.json).
# In your own game, either `wally add stagehand/hooks` once it is published, or copy hooks/src into
# your Packages folder as StagehandHooks.
[package]
name = "stagehand/example-place"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
private = true

[dependencies]
