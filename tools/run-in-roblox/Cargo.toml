[package]
name = "run-in-roblox"
version = "0.4.0-stagehand"
description = "Run stuff inside Roblox Studio — Stagehand fork with a Linux/Wine backend"
authors = ["Lucien Greathouse <me@lpghatguy.com>", "Stagehand contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/unix-system/Stagehand"
publish = false

[[bin]]
name = "run-in-roblox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.4", features = ["termination"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
roblox_install = "1.2"
